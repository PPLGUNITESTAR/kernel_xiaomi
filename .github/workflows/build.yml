name: "Build Kernel"

env:
  KERNEL_NAME: "CrypT"
  DEVICE: "Sweet"
  CODENAME: "Asphyxia"
  DEFCONFIG: "sweet_defconfig"

  CLANG_VER: "20250912"
  CLANG_URL: "https://github.com/liliumproject/clang/releases/download/20250912/lilium_clang-20250912.tar.gz"

  KBUILD_BUILD_USER: "0xArCHDeViL"
  KBUILD_BUILD_HOST: "Gentoo"
  TZ: "Asia/Jakarta"

  KSU_SETUP_URI: "https://github.com/ReSukiSU/ReSukiSU/raw/refs/heads/main/kernel/setup.sh"
  KSU_BRANCH: "main"
  KSU_GENERAL_PATCH: "https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd/raw/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh"
  SUSFS_PATCH: "https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd/raw/refs/heads/mainline/Patches/Patch/susfs_patch_to_4.14.patch"
  MAIN_DEFCONFIG: "arch/arm64/configs/sweet_defconfig"

on:
  workflow_dispatch:
    inputs:
      ksu_selected:
        description: "KernelSU variant"
        required: true
        default: "zako"
        type: choice
        options:
          - "zako"
          - "zako_susfs"
          - ""

jobs:
  build:
    name: "AOSP-KSU BUILD"
    runs-on: ubuntu-22.04

    steps:
      - name: "⬢ Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "⚡ Cache Clang"
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: aosp-clang
          key: ${{ runner.os }}-clang-${{ env.CLANG_VER }}

      - name: "🔧 Download Clang"
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          wget -q $CLANG_URL -O clang.tar.zst
          mkdir -p aosp-clang
          tar --zstd -xf clang.tar.zst -C aosp-clang
          rm -f clang.tar.zst

      - name: "📦 Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git libncurses5-dev libssl-dev libxml2 libxml2-utils lzop make \
            python3 unzip zip zlib1g-dev

      - name: "⚙️ Setup ccache"
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ccache -M 2G
          ccache -o compression=true
          ccache -z

      - name: "🧩 KernelSU — zako (no SUSFS)"
        if: ${{ github.event.inputs.ksu_selected == 'zako' }}
        run: |
          curl -LSs "$KSU_SETUP_URI" | bash -s "$KSU_BRANCH"
          curl -LSs "$KSU_GENERAL_PATCH" | bash
          echo "CONFIG_KSU=y"                        >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y"  >> $MAIN_DEFCONFIG
          echo "CONFIG_KPM=n"                        >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y"            >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_SUSFS=n"                  >> $MAIN_DEFCONFIG
          echo "CONFIG_HAVE_SYSCALL_TRACEPOINTS=y"   >> $MAIN_DEFCONFIG

      - name: "🔬 KernelSU — zako_susfs (with SUSFS)"
        if: ${{ github.event.inputs.ksu_selected == 'zako_susfs' }}
        run: |
          curl -LSs "$KSU_SETUP_URI" | bash -s "$KSU_BRANCH"
          curl -LSs "$KSU_GENERAL_PATCH" | bash

          echo ">>> Applying SUSFS kernel patch..."
          wget -qO- "$SUSFS_PATCH" | patch -s -p1 --fuzz=5

          echo "CONFIG_KSU=y"                                        >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y"                  >> $MAIN_DEFCONFIG
          echo "CONFIG_KPM=n"                                        >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y"                            >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y"                                  >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=n"                         >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=n"                        >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"                        >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"                      >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"                       >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"           >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"      >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=n"                    >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MAP=n"                          >> $MAIN_DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=n"                       >> $MAIN_DEFCONFIG
          echo "CONFIG_HAVE_SYSCALL_TRACEPOINTS=y"                   >> $MAIN_DEFCONFIG

      - name: "⏭️ KernelSU — skipped"
        if: ${{ github.event.inputs.ksu_selected == '' }}
        run: echo "No KernelSU variant selected, skipping."

      - name: "Build Kernel"
        run: |
          export PATH="${{ github.workspace }}/aosp-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ${DEFCONFIG}

          make -j$(nproc --all) O=out \
            LLVM=1 LLVM_IAS=1 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbo.img dtb.img

      - name: "📊 Ccache Stats"
        run: ccache -s

      - name: "📤 Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: AOSP-KSU
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb.img
            out/arch/arm64/boot/dtbo.img

  release:
    name: "📦 Release"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: "📥 Download Artifact"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: "📦 AnyKernel3 Packaging"
        run: |
          git clone -q https://github.com/RapliVx/AnyKernel3.git -b sweet AnyKernel3
          cp artifacts/AOSP-KSU/Image.gz AnyKernel3/
          cp artifacts/AOSP-KSU/dtb.img AnyKernel3/
          cp artifacts/AOSP-KSU/dtbo.img AnyKernel3/

          cd AnyKernel3
          zip -r "../${KERNEL_NAME}-AOSP-KSU-${CODENAME}-$(date +'%Y%m%d').zip" * -x .git README.md

      - name: "⬆️ Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "AOSP-KSU-${{ github.run_number }}"
          name: "AOSP-KSU"
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
