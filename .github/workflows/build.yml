name: "Build Kernel"

env:
  KERNEL_NAME: "CrypT"
  DEVICE: "Sweet"
  CODENAME: "Asphyxia"
  DEFCONFIG: "sweet_defconfig"

  # Clang baru
  CLANG_VER: "20260130"
  CLANG_URL: "https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz"

  KBUILD_BUILD_USER: "0xArCHDeViL"
  KBUILD_BUILD_HOST: "Gentoo"
  TZ: "Asia/Jakarta"

on:
  workflow_dispatch:

jobs:
  build:
    name: "⚔️ AOSP-KSU BUILD"
    runs-on: ubuntu-22.04

    steps:
      - name: "⬢ Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "⚡ Cache Clang"
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: aosp-clang
          key: ${{ runner.os }}-clang-${{ env.CLANG_VER }}

      - name: "🔧 Download Clang"
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          wget -q $CLANG_URL -O clang.tar.zst
          mkdir -p aosp-clang
          tar --zstd -xf clang.tar.zst -C aosp-clang
          rm -f clang.tar.zst

      - name: "📦 Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git libncurses5-dev libssl-dev libxml2 libxml2-utils lzop make \
            python3 unzip zip zlib1g-dev

      - name: "⚙️ Setup ccache"
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ccache -M 2G
          ccache -o compression=true
          ccache -z

      - name: "🧩 KernelSU Integration"
        run: |
          curl -LSs https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh | bash

      - name: "⚔️ Build Kernel"
        run: |
          export PATH="${{ github.workspace }}/aosp-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ${DEFCONFIG}

          make -j$(nproc --all) O=out \
            LLVM=1 LLVM_IAS=1 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbo.img dtb.img

      - name: "📊 Ccache Stats"
        run: ccache -s

      - name: "📤 Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: AOSP-KSU
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb.img
            out/arch/arm64/boot/dtbo.img

  release:
    name: "📦 Release"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: "📥 Download Artifact"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: "📦 AnyKernel3 Packaging"
        run: |
          git clone -q https://github.com/RapliVx/AnyKernel3.git -b sweet AnyKernel3
          cp artifacts/AOSP-KSU/Image.gz AnyKernel3/
          cp artifacts/AOSP-KSU/dtb.img AnyKernel3/
          cp artifacts/AOSP-KSU/dtbo.img AnyKernel3/

          cd AnyKernel3
          zip -r "../${KERNEL_NAME}-AOSP-KSU-${CODENAME}-$(date +'%Y%m%d').zip" * -x .git README.md

      - name: "⬆️ Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "AOSP-KSU-${{ github.run_number }}"
          name: "FranxxCORE AOSP-KSU"
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
